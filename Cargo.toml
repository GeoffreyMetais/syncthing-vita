[workspace]
resolver = "2"
members = [
    "crates/syncthing-core",
    "crates/vita-syncthing-app",
    "crates/syncthing-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
syncthing-core = { path = "crates/syncthing-core" }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = false # Important: preserve relocations (-Wl,-q) for vita-elf-create

# Used by cargo-mutants (`.cargo/mutants.toml`): test builds without debug info.
[profile.mutants]
inherits = "test"
debug = false
