name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-host:
    name: Host Tests (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets

      - name: Run all workspace unit and integration tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace

      - name: Run syncthing-cli tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test -p syncthing-cli

      - name: Check ui-script feature compilation
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p vita-syncthing-app --features ui-script

  build-vita:
    name: PS Vita Build & Symbol Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly toolchain with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: vita-nightly

      - name: Install VitaSDK
        env:
          VITASDK: ${{ runner.temp }}/vitasdk
        run: |
          ./scripts/setup_env.sh --install-vitasdk
          echo "VITASDK=${VITASDK}" >> "$GITHUB_ENV"
          echo "${VITASDK}/bin" >> "$GITHUB_PATH"

      - name: Build PS Vita release VPK
        run: ./scripts/build_vpk.sh

      - name: Audit hardware-critical ELF symbols
        run: |
          ELF_PATH="target/armv7-sony-vita-newlibeabihf/release/vita-syncthing-app.elf"
          SYMBOLS="$(arm-vita-eabi-nm -n "${ELF_PATH}")"
          grep -q "R _newlib_heap_size_user" <<< "${SYMBOLS}" || {
            echo "ERROR: _newlib_heap_size_user is missing or weak in ${ELF_PATH}!" >&2
            exit 1
          }
          grep -q "R sceUserMainThreadStackSize" <<< "${SYMBOLS}" || {
            echo "ERROR: sceUserMainThreadStackSize is missing in ${ELF_PATH}!" >&2
            exit 1
          }
          grep -E "_newlib_heap_size_user|sceUserMainThread" <<< "${SYMBOLS}"

      - name: Upload SYNCTHING.vpk artifact
        uses: actions/upload-artifact@v7
        with:
          name: SYNCTHING-vpk
          path: target/armv7-sony-vita-newlibeabihf/release/SYNCTHING.vpk
          if-no-files-found: error

  e2e-cli:
    name: CLI <-> CLI E2E (LAN & Internet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run CLI <-> CLI E2E (LAN discovery + Global Discovery & Relay)
        run: ./.agents/skills/syncthing-e2e-validation/scripts/validate.sh --only cli-lan,internet --out target/e2e-cli

      - name: Upload CLI E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-e2e-logs
          path: target/e2e-cli
          if-no-files-found: ignore

  e2e-vita3k-core:
    name: Vita3K <-> CLI E2E (LAN, Internet, Inbound & Lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly toolchain with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: vita3k-e2e

      - name: Install Vita3K runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb unzip python3-pil libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install VitaSDK, just, and Vita3K
        env:
          VITASDK: ${{ runner.temp }}/vitasdk
        run: |
          ./scripts/setup_env.sh --install-vitasdk
          ./scripts/setup_env.sh --install-just
          ./scripts/setup_env.sh --install-vita3k
          echo "VITASDK=${VITASDK}" >> "$GITHUB_ENV"
          echo "${VITASDK}/bin" >> "$GITHUB_PATH"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Build PS Vita VPK with ui-script
        run: CARGO_FEATURES=ui-script just vpk

      - name: E2E Sync Vita3K <-> CLI (LAN)
        run: ./scripts/vita3k_cli_sync.sh 45 target/e2e-vita3k-lan lan

      - name: E2E Sync Vita3K <-> CLI (Internet / Global Discovery + Relay)
        run: ./scripts/vita3k_cli_sync.sh 90 target/e2e-vita3k-internet internet

      - name: E2E Inbound TCP 22000 & DeviceOffer (Vita3K <-> CLI)
        run: ./scripts/vita3k_inbound_e2e.sh all target/e2e-vita3k-inbound

      - name: E2E Connection Lifecycle (Vita3K <-> CLI)
        run: ./scripts/vita3k_connection_lifecycle.sh target/e2e-vita3k-lifecycle

      - name: Upload Vita3K Core E2E logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vita3k-e2e-core-logs
          path: |
            target/e2e-vita3k-lan
            target/e2e-vita3k-internet
            target/e2e-vita3k-inbound
            target/e2e-vita3k-lifecycle
          if-no-files-found: ignore

  e2e-vita3k-roaming:
    name: Vita3K <-> CLI E2E (Roaming & Fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust nightly toolchain with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: vita3k-e2e

      - name: Install Vita3K runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb unzip python3-pil libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install VitaSDK, just, and Vita3K
        env:
          VITASDK: ${{ runner.temp }}/vitasdk
        run: |
          ./scripts/setup_env.sh --install-vitasdk
          ./scripts/setup_env.sh --install-just
          ./scripts/setup_env.sh --install-vita3k
          echo "VITASDK=${VITASDK}" >> "$GITHUB_ENV"
          echo "${VITASDK}/bin" >> "$GITHUB_PATH"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Build PS Vita VPK with ui-script
        run: CARGO_FEATURES=ui-script just vpk

      - name: E2E Sync Vita3K <-> CLI (Internet -> LAN roaming)
        run: ./scripts/vita3k_cli_sync.sh 90 target/e2e-vita3k-internet-then-lan internet-then-lan

      - name: E2E Sync Vita3K <-> CLI (LAN -> Internet fallback)
        run: ./scripts/vita3k_cli_sync.sh 90 target/e2e-vita3k-lan-then-internet lan-then-internet

      - name: Upload Vita3K Roaming E2E logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vita3k-e2e-roaming-logs
          path: |
            target/e2e-vita3k-internet-then-lan
            target/e2e-vita3k-lan-then-internet
          if-no-files-found: ignore
