[package]
name = "syncthing-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
rsa = { version = "0.10", default-features = false, features = ["pkcs1v15", "encoding"] }
aead = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false }
x25519-dalek = { version = "2", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "std", "zeroize"] }
hmac = { version = "0.13", default-features = false }
der = { version = "0.8", default-features = false }
pkcs8 = { version = "0.11", default-features = false, features = ["pem", "pkcs5"] }
sec1 = { version = "0.8", default-features = false, features = ["pem"] }
digest = { version = "0.11", default-features = false }
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] }
webpki-roots = "1.0.12"
